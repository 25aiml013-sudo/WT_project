<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef5ff;
            margin: 0;
        }

        header {
            background-color: #34495e;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .box {
            background-color: white;
            width: 350px;
            margin: 40px auto;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            color: #2980b9;
        }

        p {
            font-size: 16px;
        }

        button {
            background-color: #2980b9;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }

        footer {
            background-color: #34495e;
            color: white;
            text-align: center;
            padding: 10px;
        }

    </style>
</head>

<body>

<header>
    <h1>Student Hub</h1>
    <p>My Profile</p>
</header>

<div class="box">

    <h2>Rahul Sharma</h2>

    <p><b>Student ID:</b> 101</p>

    <p><b>Course:</b> BCA</p>

    <p><b>Email:</b> rahul@gmail.com</p>

    <p><b>Phone:</b> +91 9876543210</p>

    <p><b>Skills:</b> HTML, CSS, Java, Python</p>

    <p>
        Welcome to my profile. I am a student who loves learning
        new technologies and improving my skills.
    </p>

    <button>Edit Profile</button>

</div>

<footer>
    <p>© 2026 Student Hub</p>
</footer>

</body>
</html>
