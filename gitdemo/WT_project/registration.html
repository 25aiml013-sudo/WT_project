<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=0000000, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="reg.css">

    <script>
        function f()
        {
            alert("Fill the registration form");
        }
        
    </script>

</head>

<body>
    <h2>Student registration Form</h2>
    <form >
        <label >Full Name</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label >Enrollment number</label><br>
        <input type="text" placeholder="Enter your Enrollment Number"><br><br>

        <label >Email</label><br>
        <input type="email" placeholder="Enter email"><br><br>

        <label >Password</label><br>
        <input type="password" placeholder="Enter password"><br><br>

        <label >Gender</label><br>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">other
        <br><br>

        <label> Department</label><br>
        <select >
            <option >Computer engineering</option>
            <option >Information Technology </option>
            <option >Civil engineering</option>
            <option >AIML engineering</option>

        </select>
        <br><br>
        <label >Hobbies</label><br>
        <input type="checkbox">Reading
        <input type="checkbox">Sports
        <input type="checkbox">Music
        <br><br>

        <label >Address</label><br>
        <textarea rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="Reset" value="Reset">
    

    </form>
    
</body>
</html>
