<!DOCTYPE html>
<html>
<head>
    <title>Student Hub - Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .feedback {
            width: 60%;
            margin: 30px auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .footer {
            text-align: center;
            padding: 15px;
            color: gray;
        }

    </style>
</head>

<body>

    <div class="header">
        <h1>Student Hub</h1>
        <p>Share your feedback with us</p>
    </div>


    <div class="feedback">

        <h2>Feedback Form</h2>

        <form>

            <label>Student Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Course</label>
            <select>
                <option>Select Course</option>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>BBA</option>
                <option>MCA</option>
            </select>

            <label>Your Feedback</label>
            <textarea placeholder="Write your feedback here..."></textarea>

            <label>Rating</label>
            <select>
                <option>Excellent</option>
                <option>Good</option>
                <option>Average</option>
                <option>Poor</option>
            </select>

            <button type="submit">Submit Feedback</button>

        </form>

    </div>


    <div class="footer">
        © 2026 Student Hub | All Rights Reserved
    </div>

</body>
</html>
